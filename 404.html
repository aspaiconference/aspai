<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | ASPAI</title>

  <!-- ============================================================
       GitHub Pages는 없는 주소로 들어오면 이 파일을 보여줍니다.
       2026년까지는 사이트가 루트에 있었기 때문에, 이미 홍보된 옛 주소
       (예: /summer-school.html, /korea.html, /slides/xxx.pdf)를
       /2026/ 아래의 같은 경로로 넘겨줍니다.
       연도 폴더(/2026/, /2027/ ...) 안에서 생긴 404는 넘기지 않고 안내만 보여줍니다.
       이 페이지는 아무 경로에서나 열리므로 링크는 반드시 "/"로 시작하는 절대경로로 쓰세요.
       ============================================================ -->
  <meta name="robots" content="noindex" />

  <script>
    (function () {
      var path = location.pathname;
      if (!/^\/20\d\d(\/|$)/.test(path)) {
        location.replace("/2026" + path + location.search + location.hash);
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #e8ecf8;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #7aa2ff; }
  </style>
</head>
<body>
  <p>
    Page not found.<br />
    <a href="/">Go to the ASPAI homepage</a>
  </p>
</body>
</html>
